[pytest]
DJANGO_SETTINGS_MODULE = sycamore.settings.development
# 仅收集 test_*.py；历史 tests.py（Django TestCase）由 manage.py test 运行，
# pytest 下其模型导入路径（backend.apps.*）与 app_label 解析不兼容
python_files = test_*.py
# --no-migrations：跳过迁移文件（部分迁移引用生产库外部表，测试库无法执行），
# 直接按当前 models 建表；外部表（wealth_bill_list 等）由 conftest.py 手动建
addopts = -q --reuse-db --no-migrations
